<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ee">
  <meta name="description" content="一个只把数据保存在你自己浏览器里的个人能量观察工具。">
  <title>能量实验室｜你的私人能量观察工具</title>
  <link rel="stylesheet" href="style-v2.css">
</head>
<body>
  <header class="mobile-topbar">
    <div class="mobile-brand">
      <span class="brand-mark brand-mark--small" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>能量实验室</span>
    </div>
    <span class="privacy-pill privacy-pill--compact"><span class="privacy-dot"></span>仅存本机</span>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <div>
            <h1>能量实验室</h1>
            <p>Personal Energy Lab</p>
          </div>
        </div>
        <div class="privacy-card">
          <span class="privacy-dot"></span>
          <div>
            <strong>数据只保存在此浏览器</strong>
            <span>不注册，不上传，不经过服务器</span>
          </div>
        </div>
      </div>

      <nav aria-label="主要功能">
        <button id="nav-record" class="active" type="button">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 7v5l3 2"/></svg></span>
          <span class="nav-copy"><b>记录</b><small>捕捉此刻状态</small></span>
        </button>
        <button id="nav-map" type="button">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19V3"/></svg></span>
          <span class="nav-copy"><b>能量地图</b><small>发现个人规律</small></span>
        </button>
        <button id="nav-exp" type="button">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v5l-5 9a2.5 2.5 0 0 0 2.2 4h9.6a2.5 2.5 0 0 0 2.2-4l-5-9V3"/><path d="M8 15h8"/></svg></span>
          <span class="nav-copy"><b>七天实验</b><small>验证一个变量</small></span>
        </button>
        <button id="nav-audit" type="button">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
          <span class="nav-copy"><b>周审计</b><small>把记录变成洞察</small></span>
        </button>
        <button id="nav-toolbox" type="button">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4z"/><path d="M9 8V5h6v3"/><path d="M4 13h16"/></svg></span>
          <span class="nav-copy"><b>工具箱</b><small>沉淀有效方法</small></span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <p>这不是心理或医疗诊断工具。所有观察仅用于帮助你理解自己的生活模式。</p>
        <span>By YAO · 30+ 重启人生实验室</span>
      </div>
    </aside>

    <section class="workspace">
      <header class="workspace-header">
        <div class="page-heading">
          <p id="page-kicker">每日观察</p>
          <h2 id="page-title">记录此刻的能量</h2>
          <p id="page-description">不用解释自己。用 30 秒留下一个真实切片。</p>
        </div>
        <div class="header-side">
          <span id="today-label" class="today-label"></span>
          <span class="privacy-pill"><span class="privacy-dot"></span>仅保存在此浏览器</span>
        </div>
      </header>

      <main id="main" aria-live="polite"></main>

      <footer>
        <div class="footer-disclaimer">
          <strong>使用边界</strong>
          <p>能量实验室是自我观察和生活管理工具，不是心理诊断或医疗建议。记录中出现的模式只代表相关性，不代表因果。</p>
        </div>
        <p>数据不会离开你的浏览器。清除浏览器数据前，请先使用“导出备份”。</p>
      </footer>
    </section>
  </div>

  <script src="app.js"></script>
  <script src="ui.js"></script>
</body>
</html>
